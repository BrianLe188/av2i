# One command to run the platform: `docker compose up -d` (set POSTGRES_PASSWORD in a .env file first; see .env.example).
services:
  db:
    image: postgres:18
    restart: unless-stopped
    environment:
      POSTGRES_USER: av2i
      POSTGRES_DB: av2i
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    volumes:
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U av2i -d av2i"]
      interval: 5s
      timeout: 3s
      retries: 10

  app:
    build: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://av2i:${POSTGRES_PASSWORD}@db:5432/av2i
      # the password `admin` gets on the first start; leave empty to start with `admin` and be asked to change it
      ADMIN_INITIAL_PASSWORD: ${ADMIN_INITIAL_PASSWORD:-}
      # set to true when a reverse proxy that terminates HTTPS sits in front
      TRUST_PROXY: ${TRUST_PROXY:-false}
    ports:
      - "${PORT:-3000}:3000"

volumes:
  pgdata:
